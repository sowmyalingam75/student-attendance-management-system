<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Attendance Management System</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">

    <div class="auth-card">
        <!-- Card Header -->
        <div class="auth-header">
            <div class="auth-brand-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1>AttendEase Portal</h1>
            <p>Student Attendance Management System</p>
        </div>

        <!-- Card Body -->
        <div class="auth-body">
            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert-banner alert-{{ category }}" style="padding: 12px 14px; margin-bottom: 20px;">
                            <i class="fa-solid fa-circle-exclamation alert-icon"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.login') }}" method="POST">
                <!-- Username / ID -->
                <div class="form-group">
                    <label for="username" class="form-label">Username / Student ID / Teacher ID</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="username" name="username" class="form-control" 
                               value="{{ username or '' }}" placeholder="e.g. admin, teacher01, STU001" required autofocus>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" class="form-control" 
                               placeholder="Enter your account password" required>
                        <button type="button" class="password-toggle-btn" data-target="password" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Sign In to Portal</span>
                </button>
            </form>

            <!-- Quick Demo Credentials Selector -->
            <div class="quick-creds-box">
                <div class="quick-creds-title">
                    <i class="fa-solid fa-key" style="margin-right: 4px;"></i> Quick Demo Fill:
                </div>
                <div class="quick-creds-buttons">
                    <button type="button" class="btn-cred-fill" data-user="admin" data-pass="Admin@123">
                        <i class="fa-solid fa-shield-halved"></i> Admin
                    </button>
                    <button type="button" class="btn-cred-fill" data-user="teacher01" data-pass="Teacher@123">
                        <i class="fa-solid fa-chalkboard-user"></i> Teacher
                    </button>
                    <button type="button" class="btn-cred-fill" data-user="STU001" data-pass="Student@123">
                        <i class="fa-solid fa-user-graduate"></i> Student
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main JavaScript for password toggle & quick fills -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
